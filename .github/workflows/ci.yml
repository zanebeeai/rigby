name: CI

# Plan 09 §3.4. This repository had no CI at all before this workflow, and
# development is split across macOS and Windows, so nothing caught a change that
# worked on one and broke the other.
#
# The suite is hermetic: it needs no server, no browser, no API key and no
# network. Verified by running it in full with OPENAI_API_KEY unset and every
# AF_INET/AF_INET6 socket raising on construction. Do not add secrets to this
# workflow -- see humanoid/docs/testing.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A PR run supersedes its own earlier runs, so a force-push cancels the stale one.
# A push to main must NEVER be cancelled: with six lanes merging every few minutes
# and a Windows job that takes over ten, a ref-keyed group with
# cancel-in-progress would mean main almost never completes a verification. That
# is what happened on the very first run -- 6c154e3 was cancelled by 5e8353a four
# minutes later. Keying main runs by sha gives each merge its own group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 09 §6.2, resolved 2026-08-24: Windows runs on main and on any PR touching
  # src/, evals/, config/, tests/, frontend/ or the workflow itself. A
  # documentation-only PR skips it rather than paying roughly double for nothing.
  # macOS always runs -- it is the primary development platform.
  select-platforms:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo 'os=["macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo "not a pull request -- running the full matrix"
            exit 0
          fi
          changed=$(git diff --name-only \
            '${{ github.event.pull_request.base.sha }}' \
            '${{ github.event.pull_request.head.sha }}')
          printf 'changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(humanoid/(src|evals|config|tests|frontend)/|core/|any-robot/(src|tests)/|humanoid/(pyproject\.toml|acceptance_criteria\.yaml)$|uv\.lock$|pyproject\.toml$|\.github/)'; then
            echo 'os=["macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo "code changed -- Windows included"
          else
            echo 'os=["macos-latest"]' >> "$GITHUB_OUTPUT"
            echo "docs-only change -- Windows skipped (09 §6.2)"
          fi

  python:
    needs: select-platforms
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select-platforms.outputs.os) }}
    runs-on: ${{ matrix.os }}
    # 30 was not headroom, it was the failure mode: every main run from
    # 33092603029 onward ended "The operation was canceled" at 30m1x on Windows.
    # The suite is smaller now; this is a hang detector, not a budget.
    #
    # 45 became the failure mode too: main's Windows job took 38m38s on
    # 33321402181, and on PR #20 it completed in 44m14s once (2389 passed) and
    # was cancelled at 76% and at 74% on the two runs beside it. The macOS
    # job took 29m. 60 keeps the hang detector a hang detector.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: humanoid
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra dev

      # ONE run. `addopts` is `-m 'fast or medium'`, so the fast tier is a subset
      # of this and running `pytest -m fast` first re-ran all 703 of its tests to
      # produce a single number. The conftest hooks record that number as a
      # by-product instead -- summed `fast` test duration plus collection, which
      # is what the separate run's wall clock was measuring.
      #
      # No secret is set for this step, deliberately. If the suite ever needs
      # one, tests/test_invocations.py fails first and says why.
      - name: pytest
        env:
          RIGBY_TIER_REPORT: ${{ runner.temp }}/tier.json
        run: uv run pytest

      # The rot ceiling, read from the run above rather than from a second one.
      #
      # It exists because the fast tier is the eval-iteration loop and a compile,
      # a corpus load or a subprocess entering it costs minutes rather than
      # seconds. It has fired for real: a module-level corpus compile in
      # test_corpus_known_bad.py was paid at COLLECTION on every invocation --
      # `-m fast` included, which then deselected every test in that file -- and
      # took the tier to 131s. Collection is therefore inside the measurement.
      #
      # macOS only: a wall-clock budget on the Windows runner, which is roughly
      # 4x slower for reasons unrelated to what the tier contains, is a platform
      # tripwire wearing a performance gate's costume.
      - name: the fast tier has acquired nothing expensive
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/tier.json"
          test -f "$report" || {
            echo "::error::no tier report at $report -- the conftest hook did not run"
            exit 1
          }
          cat "$report"
          elapsed=$(python3 -c "import json,sys;print(int(json.load(open(sys.argv[1]))['fast_tier_seconds']))" "$report")
          collect=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['collect_seconds'])" "$report")
          echo "::notice::fast tier: ${elapsed}s (collection ${collect}s) on a dedicated runner"
          if [ "$elapsed" -gt 90 ]; then
            echo "::error::fast tier took ${elapsed}s, over the 90s rot ceiling."
            echo "Something expensive entered the tier -- a compile, a corpus load"
            echo "or a subprocess. Check collection first: module-level work is paid"
            echo "even by the tests it is then deselected for. Classify by input, not"
            echo "by duration, and do not demote a file to medium to fit."
            echo "See humanoid/docs/testing.md."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: humanoid/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: humanoid/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Cross-ISA hashes can only be contributed by a machine of that ISA, and every
  # developer here is on darwin-arm64. This job runs the corpus bless on Windows
  # and uploads the result as an artifact so lane `groundtruth` can merge the
  # win32-amd64 column into evals/corpus without owning a Windows machine.
  #
  # It NEVER commits and it never gates: `continue-on-error` here is not papering
  # over a failure, because the job asserts nothing. Its whole output is the
  # artifact. The actual cross-platform assertion is in the pytest job above and
  # that one is allowed to go red.
  windows-corpus-hashes:
    # `workflow_dispatch` only, as of the test-suite trim. This job asserts
    # nothing -- it is `continue-on-error` at the JOB level, so its conclusion
    # cannot affect the workflow's, and its whole output is an artifact that a
    # human merges into evals/corpus by hand. Running a 30-minute Windows job on
    # every code PR to produce a file nobody reads on that PR is the definition
    # of a job that should be asked for rather than paid for. Run it from the
    # Actions tab when you are about to bless a cross-ISA column.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        working-directory: humanoid
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra dev

      - name: bless the corpus for this platform
        run: uv run python -m evals.corpus bless --write

      # `git diff --stat` cannot answer the question a bless needs answered.
      # Adding a second platform's digest rewrites the first entry's line, so a
      # PURE ADDITION renders as deletions -- the first Windows bless reported
      # 423 insertions and 282 deletions with zero digests changed. Compare by
      # value instead; exit code is the number of pre-existing digests that moved.
      - name: did this bless change any pre-existing digest?
        run: uv run python -m evals.bless_diff

      - name: the raw diff, for reference only
        run: git --no-pager diff --stat -- evals/corpus

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-hashes-win32-amd64
          path: humanoid/evals/corpus/cases/**/expected.json
          if-no-files-found: warn

  # core/ is the tier both product stacks compile against, so it is verified on
  # its own and not only through its consumers. The neutrality guard lives here:
  # if anything in core/ grows an import of rigby_v2, rigby_poc or rigby_general,
  # this job goes red rather than the coupling being rediscovered a year later.
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra dev
      - run: uv run pytest

  # any-robot/ had no CI at all before the split: every job in this workflow set
  # `working-directory: humanoid`, so 12.6k lines and 128 tracked files were
  # verified by nothing. Ubuntu only for now -- unlike humanoid this tier has no
  # established cross-platform contract to protect, and adding one it does not
  # have would be a tripwire rather than a gate.
  any-robot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: any-robot
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra dev
      - run: uv run pytest
