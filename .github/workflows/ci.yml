name: CI

# Plan 09 §3.4. This repository had no CI at all before this workflow, and
# development is split across macOS and Windows, so nothing caught a change that
# worked on one and broke the other.
#
# The suite is hermetic: it needs no server, no browser, no API key and no
# network. Verified by running it in full with OPENAI_API_KEY unset and every
# AF_INET/AF_INET6 socket raising on construction. Do not add secrets to this
# workflow -- see rigby-humanoid/docs/testing.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A PR run supersedes its own earlier runs, so a force-push cancels the stale one.
# A push to main must NEVER be cancelled: with six lanes merging every few minutes
# and a Windows job that takes over ten, a ref-keyed group with
# cancel-in-progress would mean main almost never completes a verification. That
# is what happened on the very first run -- 6c154e3 was cancelled by 5e8353a four
# minutes later. Keying main runs by sha gives each merge its own group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 09 §6.2, resolved 2026-08-24: Windows runs on main and on any PR touching
  # src/, evals/, config/, tests/, frontend/ or the workflow itself. A
  # documentation-only PR skips it rather than paying roughly double for nothing.
  # macOS always runs -- it is the primary development platform.
  select-platforms:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo 'os=["macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo "not a pull request -- running the full matrix"
            exit 0
          fi
          changed=$(git diff --name-only \
            '${{ github.event.pull_request.base.sha }}' \
            '${{ github.event.pull_request.head.sha }}')
          printf 'changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(rigby-humanoid/(src|evals|config|tests|frontend)/|rigby-humanoid/(pyproject\.toml|uv\.lock|acceptance_criteria\.yaml)$|\.github/)'; then
            echo 'os=["macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo "code changed -- Windows included"
          else
            echo 'os=["macos-latest"]' >> "$GITHUB_OUTPUT"
            echo "docs-only change -- Windows skipped (09 §6.2)"
          fi

  python:
    needs: select-platforms
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select-platforms.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rigby-humanoid
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: rigby-humanoid/uv.lock
      - run: uv sync --extra dev

      # The fast tier is the eval-iteration loop. This step REPORTS its duration
      # every run and fails only above a deliberately loose ceiling.
      #
      # Plan 09 SS5 asks for a 30s failing budget. That number has never been
      # measured on a controlled machine and cannot be: locally the same 291
      # tests took 25.6s, 33.5s, 43.6s, 44.9s and 42.6s depending on how many of
      # the six worktrees happened to be compiling. Shipping a 30s assertion on
      # an unvalidated number would make main red for load rather than for rot.
      #
      # So: the runner is dedicated, its number is the trustworthy one, and it is
      # printed every run so the trend is visible. The ceiling catches genuine
      # rot -- a compile or a corpus load entering the tier costs minutes, not
      # seconds -- without tripping on runner variance. Tighten it to the real
      # budget once a few runs have established the baseline. Recorded in
      # rigby-humanoid/docs/testing.md as provisional.
      #
      # macOS only: a wall-clock budget on the Windows runner, which is roughly
      # 4x slower for reasons unrelated to what the tier contains, is a platform
      # tripwire wearing a performance gate's costume.
      - name: measure the fast tier
        if: matrix.os == 'macos-latest'
        run: |
          start=$(date +%s)
          uv run pytest -m fast
          elapsed=$(( $(date +%s) - start ))
          echo "::notice::fast tier: ${elapsed}s on a dedicated runner"
          if [ "$elapsed" -gt 90 ]; then
            echo "::error::fast tier took ${elapsed}s, over the 90s rot ceiling."
            echo "Something expensive entered the tier -- a compile, a corpus load"
            echo "or a subprocess. Classify by input, not by duration, and do not"
            echo "demote a file to medium to fit. See rigby-humanoid/docs/testing.md."
            exit 1
          fi
        shell: bash

      # No secret is set for this step, deliberately. If the suite ever needs
      # one, tests/test_invocations.py fails first and says why.
      - name: pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rigby-humanoid/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: rigby-humanoid/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # config/camera.v1.json is the source for every value shared across the
  # Python/TypeScript boundary. A stale generated file means evidence captured at
  # one FOV judged against the contract for another, so it fails the build rather
  # than diverging quietly. Plan 08 SS3.3.
  generated-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rigby-humanoid
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: rigby-humanoid/uv.lock
      - run: uv sync --extra dev
      - name: frontend/src/generated/camera.ts is not stale
        run: uv run python -m evals.generate_camera_ts --check

  # Cross-ISA hashes can only be contributed by a machine of that ISA, and every
  # developer here is on darwin-arm64. This job runs the corpus bless on Windows
  # and uploads the result as an artifact so lane `groundtruth` can merge the
  # win32-amd64 column into evals/corpus without owning a Windows machine.
  #
  # It NEVER commits and it never gates: `continue-on-error` here is not papering
  # over a failure, because the job asserts nothing. Its whole output is the
  # artifact. The actual cross-platform assertion is in the pytest job above and
  # that one is allowed to go red.
  windows-corpus-hashes:
    needs: select-platforms
    if: contains(needs.select-platforms.outputs.os, 'windows')
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rigby-humanoid
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: rigby-humanoid/uv.lock
      - run: uv sync --extra dev

      - name: bless the corpus for this platform
        run: uv run python -m evals.corpus bless --write

      # `git diff --stat` cannot answer the question a bless needs answered.
      # Adding a second platform's digest rewrites the first entry's line, so a
      # PURE ADDITION renders as deletions -- the first Windows bless reported
      # 423 insertions and 282 deletions with zero digests changed. Compare by
      # value instead; exit code is the number of pre-existing digests that moved.
      - name: did this bless change any pre-existing digest?
        run: uv run python -m evals.bless_diff

      - name: the raw diff, for reference only
        run: git --no-pager diff --stat -- evals/corpus

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-hashes-win32-amd64
          path: rigby-humanoid/evals/corpus/cases/**/expected.json
          if-no-files-found: warn
