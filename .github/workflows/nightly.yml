name: Nightly

# Plan 09 §3.1 and §3.4. Coverage costs a measured 3.95x on this suite -- almost
# all of it tracing the 7,815-line compiler.py -- so it runs here and never on a
# PR or a local invocation. COVERAGE_CORE=sysmon selects Python 3.12's
# sys.monitoring backend instead of settrace, which is what makes it affordable
# at all.
#
# The slow tier lands with the markers in PR 09b; this job gains `-m slow` then.

on:
  schedule:
    - cron: '17 7 * * *'   # 07:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rigby-poc
    env:
      COVERAGE_CORE: sysmon
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: rigby-poc/uv.lock
      - run: uv sync --extra dev
      - name: pytest with coverage
        run: uv run pytest --cov=rigby_poc --cov=evals --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: rigby-poc/coverage.xml
          if-no-files-found: error
