name: Nightly

# Plan 09 §3.1 and §3.4. Coverage costs a measured 3.95x on this suite -- almost
# all of it tracing the 7,815-line compiler.py -- so it runs here and never on a
# PR or a local invocation. COVERAGE_CORE=sysmon selects Python 3.12's
# sys.monitoring backend instead of settrace, which is what makes it affordable
# at all.
#
# The slow tier landed with the markers and this job never gained `-m slow`, so
# for months a bare `pytest` here selected `fast or medium` -- byte-identical to
# what every PR already ran, making this job "CI again, with coverage" while the
# slow tier ran in no automated context at all. Both selections run below.

on:
  schedule:
    - cron: '17 7 * * *'   # 07:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: humanoid
    env:
      COVERAGE_CORE: sysmon
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra dev
      - name: pytest with coverage
        run: uv run pytest --cov=rigby_poc --cov=evals --cov-report=term --cov-report=xml

      # The slow tier. Never implied by a bare `pytest`, so this is the only
      # place it runs: render, real browser, model calls, calibration, and the
      # corpus compile-budget guard, which re-runs 13 test files in their own
      # pytest sessions and cost 20% of every PR run while it sat in `medium`.
      #
      # Separate step, and it is allowed to go red. A compile-count regression
      # should be visible the next morning rather than at the next release.
      - name: the slow tier
        run: uv run pytest -m slow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: humanoid/coverage.xml
          if-no-files-found: error
