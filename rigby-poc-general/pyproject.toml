[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rigby-general"
version = "0.1.0"
description = "Robot-agnostic motion primitives: arbitrary URDF in, certified primitive library out"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "mujoco==3.11.0",
  "numpy==2.5.1",
  "openai==2.53.0",
  "pillow==12.1.1",
  "pgvector==0.5.0",
  "psycopg[binary,pool]==3.3.4",
  "pydantic==2.13.4",
  "python-multipart==0.0.20",
  "python-dotenv==1.2.2",
  "rigby-poc",
  "scipy==1.18.0",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
]

[project.scripts]
rigby-general = "rigby_general.app:run"
rigby-general-worker = "rigby_general.worker:run"

[tool.uv.sources]
rigby-poc = { path = "../rigby-poc", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/rigby_general"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
