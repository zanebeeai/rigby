<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rigby — Gripper</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: #171a21; color: #e8ecf3;
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
        display: grid; grid-template-rows: auto 1fr auto; height: 100vh;
      }
      header {
        padding: 10px 16px; border-bottom: 1px solid #2a2f3a;
        display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap;
      }
      h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .01em; }
      .body-switch { display: flex; gap: 6px; margin-left: auto; }
      .body-switch a, .body-switch span {
        padding: 4px 12px; border-radius: 999px; text-decoration: none;
        border: 1px solid #333a47; color: #9aa6b8; font-size: 12px;
      }
      .body-switch span { background: #2b6cb0; border-color: #2b6cb0; color: #fff; }
      #view { width: 100%; height: 100%; display: block; }
      footer {
        padding: 10px 16px; border-top: 1px solid #2a2f3a;
        display: grid; gap: 8px;
      }
      .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
      input[type=range] { flex: 1; min-width: 220px; accent-color: #2b6cb0; }
      .readout { font-variant-numeric: tabular-nums; color: #9aa6b8; }
      .readout b { color: #e8ecf3; font-weight: 600; }
      .phase { color: #7fd1a8; font-weight: 600; }
      button {
        background: #232833; color: #e8ecf3; border: 1px solid #333a47;
        border-radius: 6px; padding: 5px 14px; cursor: pointer; font: inherit;
      }
      button:hover { border-color: #4a5364; }
    </style>
  </head>
  <body>
    <header>
      <h1>Gripper — three segments, two fingers</h1>
      <span class="readout" id="summary">loading…</span>
      <nav class="body-switch">
        <a href="./index.html">Humanoid hand</a>
        <span>Gripper</span>
      </nav>
    </header>
    <canvas id="view"></canvas>
    <footer>
      <div class="row">
        <button id="play">▶ Play</button>
        <input type="range" id="scrub" min="0" max="0" value="0" step="1" />
        <span class="readout" id="time">0.00 s</span>
      </div>
      <div class="row readout" id="detail"></div>
    </footer>
    <script type="module" src="/src/gripper.ts"></script>
  </body>
</html>
