[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rigby-poc"
version = "0.1.0"
description = "Deterministic text-to-egocentric humanoid arm and hand animation POC"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "mujoco==3.11.0",
  "numpy==2.5.1",
  "openai==2.53.0",
  "pillow==12.1.1",
  "playwright==1.62.0",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "scipy==1.18.0",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
]

[project.scripts]
rigby-poc = "rigby_poc.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/rigby_poc"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = ["test_*.py", "backend_*.py"]
addopts = "-q"
