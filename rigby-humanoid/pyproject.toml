[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rigby-humanoid"
version = "0.1.0"
description = "Deterministic text-to-egocentric humanoid arm and hand animation POC"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "mujoco==3.11.0",
  "numpy==2.5.1",
  "openai==2.53.0",
  "pillow==12.1.1",
  "playwright==1.62.0",
  "pgvector==0.5.0",
  "psycopg[binary,pool]==3.3.4",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "scipy==1.18.0",
  "uvicorn[standard]==0.52.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  # Only used by tests/test_ci_workflow.py to parse .github/workflows/*.yml.
  # It already arrives transitively via uvicorn[standard]; pinned here so the
  # workflow guards cannot be silently disabled by a transitive dependency
  # change.
  "pyyaml==6.0.3",
]

[project.scripts]
rigby-humanoid = "rigby_poc.app:run"
rigby-v2 = "rigby_v2.app:run"
rigby-v2-worker = "rigby_v2.worker:run"

[tool.hatch.build.targets.wheel]
packages = ["src/rigby_poc", "src/rigby_v2", "evals"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = ["test_*.py", "backend_*.py"]
# `slow` needs a real browser and must never be implied by a bare `pytest`.
# `fast or medium` is everything else. Coverage stays off -- see docs/testing.md.
addopts = "-q -m 'fast or medium'"
# Registered here in 08c so lanes can mark their own files ahead of 09b without
# emitting PytestUnknownMarkWarning. 09b adds the default `-m "fast or medium"`
# selection and the marker-completeness test; until then every marker is
# declarative only and nothing is deselected. See docs/testing.md.
markers = [
  "fast: no compile, no pipeline, no corpus, no subprocess -- pure units, contract, schema",
  "medium: live compiles, corpus recompiles, flywheel with stubs",
  "slow: render, real browser, model calls, calibration -- opt-in, never implied",
]
